name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase start
      - run: |
          psql postgresql://postgres:postgres@localhost:54322/postgres -v ON_ERROR_STOP=1 -f test/isolation.sql
          psql postgresql://postgres:postgres@localhost:54322/postgres -v ON_ERROR_STOP=1 -f test/workflows.sql
          psql postgresql://postgres:postgres@localhost:54322/postgres -v ON_ERROR_STOP=1 -f test/automation_keys.sql
